<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles.css">

    <!-- Lato font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <!-- Foogle Fonts icons -->
     <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

     <!-- js file linking -->
      <script src="/script.js" defer></script>
</head>
<body>
    <main>
        <!--Main content-->
            <div class="wrapper">
                <nav class="navbar">
                    <div class="navbar__content">
                        <img src="https://assets.lego.com/logos/v8.6.0/brand-lego.svg" alt="Logo Lego">
                        
                        <ul class="navbar__options">
                            <li> <a class="navbar__buttons" href="#">Exclusives</a> </li>
                            <li> <a class="navbar__buttons" href="#">News</a> </li>
                            <li> <a class="navbar__buttons" href="#">Gift cards</a> </li>
                            <li> <a class="navbar__buttons" href="#">Find a store</a> </li>
                        </ul>

                        <button class="btn btn--icon-only-md btn--secondary">
                            <span class="material-symbols-outlined">
                                menu
                            </span>
                        </button>
                    </div>
                </nav>
            
                <section class="hero">
                    <p class="hero__subtitle">Design your</p>
                    <h1 class="hero__title">Super Hero</h1>
                    <p class="hero__description">
                        Lorem ipsum dolor sit amet consectetur adipisicing elit. Facere consectetur magni eum odio minus est ea atque ut.
                    </p>
                </section>

                <aside class="side__content">
                    <span class="side__content__label">Super Man</span>
                    
                    <div class="side__content__img">
                        <img src="https://i.ibb.co/x16pz1x/super-man.png" alt="Lego toy">
                    </div>

                    <div class="side__content__bg"></div>
                </aside>

            </div>
    </main>

        <div class="footer__wrapper">
            <footer>

                <div id="button1" class="footer__img__container">
                    <img src="https://i.ibb.co/tKWqw8J/spiderman.png" alt="Spiderman">
                </div>

                <div id="button2" class="footer__img__container">
                    <img src="https://i.ibb.co/Xzsdvgg/robin.png" alt="Robin">
                </div>

                <div id="button3" class="footer__img__container">
                    <img src="https://i.ibb.co/M18p91c/batman.webp" alt="Batman">
                </div>

            </footer>
        </div>
        

        <!-- Loader -->
        <section class="loader">
            <div class="loader__item"></div>
            <div class="loader__item"></div>
            <div class="loader__item"></div>
        </section>

        <!-- Spiderman Modal -->
        <dialog id="dialog__spiderman" class="dialog">
            <div class="dialog__content">
                <div class="dialog__header">
                    <h4 class="dialog__title">Batman limited edition</h4>
                    <button class="dialog__close__button btn btn--icon-only-md btn--secondary">
                    <span class="material-symbols-outlined">
                        close
                    </span>
                </button>
                </div>
                <div class="dialog__body">
                    <div class="dialog__slider">
                        <input type="radio" name="slider-1" id="radio-1" checked>

                        <input type="radio" name="slider-1" id="radio-2">

                        <input type="radio" name="slider-1" id="radio-3">

                        <div class="dialog__cards">
                            <label id="card-1" class="card" for="radio-1">
                                <img src="https://i.ibb.co/tKWqw8J/spiderman.png" alt="">
                            </label>

                            <label id="card-2" class="card" for="radio-2">
                                <img src="https://static.platzi.com/media/public/uploads/spider-man-2_b24c96b3-6d59-496f-815d-32b25eba0141.png" alt="">
                            </label>

                            <label id="card-3" class="card" for="radio-3">
                                <img src="https://static.platzi.com/media/public/uploads/spider-man-3_19f5c510-8059-4477-abf8-42249a5445b7.png" alt="">
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </dialog>
        
        <!-- Robin Modal -->
        <dialog id="dialog__robin" class="dialog">
            <div class="dialog__content">
                <div class="dialog__header">
                    <h4 class="dialog__title">Robin limited edition</h4>
                    <button class="dialog__close__button btn btn--icon-only-md btn--secondary">
                    <span class="material-symbols-outlined">
                        close
                    </span>
                </button>
                </div>
                <div class="dialog__body">
                    <div class="dialog__slider">
                        <input type="radio" name="slider-1" id="radio-1" checked>

                        <input type="radio" name="slider-1" id="radio-2">

                        <input type="radio" name="slider-1" id="radio-3">

                        <div class="dialog__cards">
                            <label id="card-1" class="card" for="radio-1">
                                <img src="https://i.ibb.co/Xzsdvgg/robin.png" alt="Robin 1">
                            </label>

                            <label id="card-2" class="card" for="radio-2">
                                <img src="https://www.lego.com/cdn/cs/set/assets/blt75b44ae719155230/41587.jpg?fit=bounds&format=jpg&quality=80&width=1500&height=1500&dpr=1" alt="Robin 2">
                            </label>

                            <label id="card-3" class="card" for="radio-3">
                                <img src="https://static.platzi.com/media/public/uploads/spider-man-3_19f5c510-8059-4477-abf8-42249a5445b7.png" alt="Robin 3">
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </dialog>
</body>
</html>
