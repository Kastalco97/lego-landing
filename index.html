<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles.css">

    <!-- Lato font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <!-- Foogle Fonts icons -->
     <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <!--Main content-->
            <div class="wrapper">
                <nav class="navbar">
                    <div class="navbar__content">
                        <img src="https://assets.lego.com/logos/v8.6.0/brand-lego.svg" alt="Logo Lego">
                        
                        <ul class="navbar__options">
                            <li> <a class="navbar__buttons" href="#">Exclusives</a> </li>
                            <li> <a class="navbar__buttons" href="#">News</a> </li>
                            <li> <a class="navbar__buttons" href="#">Gift cards</a> </li>
                            <li> <a class="navbar__buttons" href="#">Find a store</a> </li>
                        </ul>

                        <button class="btn btn--icon-only-md btn--secondary">
                            <span class="material-symbols-outlined">
                                menu
                            </span>
                        </button>
                    </div>
                </nav>
            
                <section class="hero">
                    <p class="hero__subtitle">Design your</p>
                    <h1 class="hero__title">Super Hero</h1>
                    <p class="hero__description">
                        Lorem ipsum dolor sit amet consectetur adipisicing elit. Facere consectetur magni eum odio minus est ea atque ut.
                    </p>
                </section>

                <aside class="side__content">
                    <span class="side__content__label">Super Man</span>
                    
                    <div class="side__content__img">
                        <img src="https://i.ibb.co/x16pz1x/super-man.png" alt="Lego toy">
                    </div>

                    <div class="side__content__bg"></div>
                </aside>

            </div>
    </main>

        <div class="footer__wrapper">
            <footer>
                <div class="footer__img__container">
                    <img src="https://i.ibb.co/M18p91c/batman.webp" alt="Batman">
                </div>

                <div class="footer__img__container">
                    <img src="https://i.ibb.co/Xzsdvgg/robin.png" alt="Robin">
                </div>

                <div class="footer__img__container">
                    <img src="https://i.ibb.co/tKWqw8J/spiderman.png" alt="Spiderman">
                </div>

            </footer>
        </div>
        

        <!-- Loader -->
        <section class="loader">
            <div class="loader__item"></div>
            <div class="loader__item"></div>
            <div class="loader__item"></div>
        </section>

        <!-- Modal -->
        <dialog class="modal">

        </dialog>
</body>
</html>
